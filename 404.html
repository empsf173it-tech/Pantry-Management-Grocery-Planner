<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryHub | 404 Not Found</title>
    <link id="bs-style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-body) 100%);
        }
        
        .empty-cart-animation {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2">
                    <rect x="3" y="3" width="22" height="22" rx="4" stroke="var(--color-primary)" stroke-width="2.2"/>
                    <line x1="3" y1="13" x2="25" y2="13" stroke="var(--color-primary)" stroke-width="2"/>
                    <rect x="6.5" y="6" width="5" height="5" rx="1.5" fill="var(--color-secondary)"/>
                    <rect x="13.5" y="6" width="8" height="5" rx="1.5" stroke="var(--color-secondary)" stroke-width="1.5"/>
                    <circle cx="8" cy="18.5" r="3" fill="var(--color-primary)"/>
                    <path d="M8 15.5C8 14 9.5 14 10 14.5" stroke="var(--color-secondary)" stroke-width="1.2" stroke-linecap="round"/>
                    <path d="M14.5 18.5L17 21L22 16" stroke="var(--color-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>PantryHub</span>
            </a>
            <div class="nav-controls ms-auto d-flex align-items-center gap-2">
                <a href="login.html" class="btn-primary-custom ms-2 px-3 py-1.5" aria-label="Login">Login</a>
            </div>
        </div>
    </nav>

    <!-- 404 SECTION -->
    <main class="error-section text-center pt-5">
        <div class="container">
            <div class="empty-cart-animation mb-5">
                <i data-lucide="package-search" size="120" class="text-primary floating-element" style="animation-duration: 4s;"></i>
                <i data-lucide="search" size="40" class="text-accent position-absolute" style="top: 20px; inset-inline-end: 20px; opacity: 0.5;"></i>
                <i data-lucide="boxes" size="30" class="text-muted position-absolute" style="bottom: 20px; inset-inline-start: 20px; opacity: 0.5;"></i>
            </div>
            
            <h1 class="display-3 fw-bold mb-3 font-display">404</h1>
            <h2 class="mb-4 fw-bold">Looks Like This Pantry Shelf Is Empty.</h2>
            <p class="lead text-muted mb-5 max-w-md mx-auto" style="max-width: 500px;">We searched every cupboard and aisle, but the page you are looking for is missing or has been moved.</p>
            
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a href="index.html" class="btn-primary-custom px-5">Back to Home</a>
                <a href="shop.html" class="btn-outline-custom px-5">Explore Pantry Shop</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
